name: educonnect

services:
  kong:
    image: kong:3.9.5           
    container_name: kong
    environment:
      KONG_DATABASE: "off"                             
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001                 
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"                
      - "127.0.0.1:8001:8001"     
    networks: [educonnect]
    depends_on: [estudiantes, matriculas, pagos, certificados]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  estudiantes:
    build: ./estudiantes
    container_name: estudiantes
    networks: [educonnect]

  matriculas:
    build: ./matriculas
    container_name: matriculas
    networks: [educonnect]

  pagos:
    build: ./pagos
    container_name: pagos
    networks: [educonnect]

  certificados:
    build: ./certificados
    container_name: certificados
    networks: [educonnect]

networks:
  educonnect:
    driver: bridge